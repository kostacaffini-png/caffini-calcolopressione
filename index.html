<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CAFFINI - Calcolo pressione piastrine rosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15171b;
    --panel:#1e2126;
    --panel-2:#262a31;
    --line:#33383f;
    --text:#eef0f2;
    --text-dim:#9aa1ab;
    --accent:#00952b;
    --accent-dim:#00611c;
    --good:#4caf6d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{
    min-height:100vh;
    padding-bottom:40px;
  }
  .logo-wrap{
    display:flex;justify-content:center;align-items:center;
    padding:18px 20px 4px;
  }
  .logo-wrap img{
    max-width:220px;width:100%;height:auto;display:block;
  }
  .topbar{
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:8px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .topbar .mark{
    width:34px;height:34px;border-radius:8px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;color:#15171b;
    flex-shrink:0;
  }
  .topbar h1{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;
    letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--text);
    text-align:center;
  }
  .topbar .titlebox{text-align:center;}
  .topbar span{display:block;font-size:11.5px;color:var(--text-dim);margin-top:1px;}

  .gauge-wrap{
    padding:26px 20px 8px;
    display:flex;flex-direction:column;align-items:center;
  }
  .gauge{position:relative;width:260px;height:150px;}
  .gauge svg{width:100%;height:100%;display:block;}
  .gauge-readout{
    position:absolute;bottom:2px;left:0;right:0;
    text-align:center;
  }
  .gauge-readout .val{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:44px;
    color:var(--accent); line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .gauge-readout .unit{
    font-family:'Inter',sans-serif;font-size:12px;color:var(--text-dim);
    letter-spacing:.08em;text-transform:uppercase;margin-top:2px;
  }
  .subreadout{
    display:flex;gap:22px;justify-content:center;margin-top:6px;
  }
  .subreadout div{text-align:center;}
  .subreadout .n{
    font-family:'Roboto Mono',monospace;font-weight:500;font-size:15px;color:var(--text);
  }
  .subreadout .l{
    font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;
  }

  .section{padding:18px 20px 4px;}
  .section h2{
    font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--text-dim);margin:0 0 10px;font-weight:500;
  }

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:14px;
  }
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;
  }
  .field .input-row{display:flex;align-items:center;gap:8px;}
  .field input[type=number]{
    flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-family:'Roboto Mono',monospace;font-size:17px;font-weight:500;
    padding:11px 12px;width:100%;outline:none;
  }
  .field input[type=number]:focus{border-color:var(--accent);}
  .field .u{font-size:12px;color:var(--text-dim);min-width:44px;}

  .nozzle-grid{display:flex;flex-direction:column;gap:8px;}
  .nozzle-row{
    display:grid;grid-template-columns:1fr 1fr 74px;gap:8px;align-items:center;
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:9px 10px;
  }
  .nozzle-row.active{border-color:var(--accent-dim);}
  .nozzle-meta{display:flex;flex-direction:column;gap:1px;}
  .nozzle-meta .top{font-family:'Roboto Mono',monospace;font-size:13.5px;color:var(--text);}
  .nozzle-meta .bot{font-size:10.5px;color:var(--text-dim);}
  .nozzle-flow{text-align:right;}
  .nozzle-flow .fv{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--text-dim);}
  .nozzle-flow .fl{font-size:9.5px;color:var(--text-dim);}
  .nozzle-row input[type=number]{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-family:'Roboto Mono',monospace;font-size:15px;font-weight:500;
    padding:8px;width:100%;text-align:center;outline:none;
  }
  .nozzle-row input[type=number]:focus{border-color:var(--accent);}

  .footer-note{
    padding:14px 20px 4px;font-size:11.5px;color:var(--text-dim);line-height:1.5;
  }
  .footer-note b{color:var(--text);}

  .reset-btn{
    margin:16px 20px 0;padding:12px;width:calc(100% - 40px);
    background:transparent;border:1px solid var(--line);border-radius:10px;
    color:var(--text-dim);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    letter-spacing:.02em;
  }
  .reset-btn:active{background:var(--panel-2);}
</style>
</head>

            stroke-dasharray="345" stroke-dashoffset="345"/>
    </svg>
    <div class="gauge-readout">
      <div class="val" id="pressureVal">–</div>
      <div class="unit">bar</div>
    </div>
  </div>
  <div class="subreadout">
    <div><div class="n" id="lminVal">0.0</div><div class="l">l/min totali</div></div>
    <div><div class="n" id="gettiVal">0</div><div class="l">getti attivi</div></div>
  </div>
</div>

<div class="section">
  <h2>Dati trattamento</h2>
  <div class="card">
    <div class="field">
      <label>Dose prodotto</label>
      <div class="input-row">
        <input type="number" id="lha" inputmode="decimal" placeholder="0" value="0" min="0">
        <span class="u">l/ha</span>
      </div>
    </div>
    <div class="field">
      <label>Velocità di avanzamento</label>
      <div class="input-row">
        <input type="number" id="velocita" inputmode="decimal" placeholder="0" value="0" min="0">
        <span class="u">km/h</span>
      </div>
    </div>
    <div class="field">
      <label>Larghezza filare</label>
      <div class="input-row">
        <input type="number" id="filari" inputmode="decimal" placeholder="0" value="0" min="0">
        <span class="u">m</span>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h2>Ugelli in uso — n° getti per tipo</h2>
  <div class="card">
    <div class="nozzle-grid" id="nozzleGrid"></div>
  </div>
</div>

<div class="footer-note">
  Questa web-app è stata sviluppata da <b>Kosta B.</b> ad uso gratuito 
 </div>

<button class="reset-btn" id="resetBtn">Azzera tutti i valori</button>

<script>
const NOZZLES = [
  {ugello:'1.0', conv:'cieco', lmin:1.40},
  {ugello:'1.2', conv:'cieco', lmin:1.86},
  {ugello:'1.2', conv:'1.0',   lmin:3.37},
  {ugello:'1.5', conv:'cieco', lmin:3.18},
  {ugello:'1.5', conv:'1.2',   lmin:5.14},
  {ugello:'1.8', conv:'cieco', lmin:4.45},
  {ugello:'1.8', conv:'1.5',   lmin:7.44},
  {ugello:'2.0', conv:'1.8',   lmin:9.90},
];

const grid = document.getElementById('nozzleGrid');
NOZZLES.forEach((n, i) => {
  const row = document.createElement('div');
  row.className = 'nozzle-row';
  row.id = 'row-' + i;
  row.innerHTML = `
    <div class="nozzle-meta">
      <div class="top">Ø ${n.ugello} mm</div>
      <div class="bot">convogl. ${n.conv}</div>
    </div>
    <div class="nozzle-flow">
      <div class="fv">${n.lmin.toFixed(2)} l/min</div>
      <div class="fl">a 20 bar</div>
    </div>
    <input type="number" id="getti-${i}" inputmode="numeric" placeholder="0" value="0" min="0" step="1">
  `;
  grid.appendChild(row);
});

const lhaEl = document.getElementById('lha');
const velEl = document.getElementById('velocita');
const filEl = document.getElementById('filari');
const pressureVal = document.getElementById('pressureVal');
const lminVal = document.getElementById('lminVal');
const gettiVal = document.getElementById('gettiVal');
const arc = document.getElementById('arc');
const ARC_LEN = 345;

// il quadrante copre 0-25 bar per la visualizzazione (puramente indicativa)
const GAUGE_MAX = 25;

function getGettiInputs(){
  return NOZZLES.map((_, i) => document.getElementById('getti-' + i));
}

function recalc(){
  const lha = parseFloat(lhaEl.value) || 0;
  const vel = parseFloat(velEl.value) || 0;
  const fil = parseFloat(filEl.value) || 0;

  const lminTotali = (lha * vel * fil) / 600;

  let sumDG = 0;
  let totGetti = 0;
  const inputs = getGettiInputs();
  NOZZLES.forEach((n, i) => {
    const g = parseFloat(inputs[i].value) || 0;
    sumDG += g * n.lmin;
    totGetti += g;
    document.getElementById('row-' + i).classList.toggle('active', g > 0);
  });

  lminVal.textContent = lminTotali.toFixed(2);
  gettiVal.textContent = totGetti;

  if (sumDG > 0 && lminTotali > 0) {
    const pressione = 20 * (lminTotali * lminTotali) / (sumDG * sumDG);
    pressureVal.textContent = pressione < 100 ? pressione.toFixed(2) : pressione.toFixed(0);
    const frac = Math.min(pressione / GAUGE_MAX, 1);
    arc.style.strokeDashoffset = ARC_LEN - (ARC_LEN * frac);
  } else {
    pressureVal.textContent = '–';
    arc.style.strokeDashoffset = ARC_LEN;
  }
}

document.body.addEventListener('input', recalc);

document.getElementById('resetBtn').addEventListener('click', () => {
  lhaEl.value = 0; velEl.value = 0; filEl.value = 0;
  getGettiInputs().forEach(inp => inp.value = 0);
  recalc();
});

recalc();
</script>
</body>
</html>
