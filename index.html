<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CAFFINI - Calcolo pressione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15171b;
    --panel:#1e2126;
    --panel-2:#262a31;
    --line:#33383f;
    --text:#eef0f2;
    --text-dim:#9aa1ab;
    --accent:#00952b;
    --accent-dim:#00611c;
    --good:#4caf6d;
  }
  html[data-theme="light"]{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --panel-2:#eef0f3;
    --line:#dde1e6;
    --text:#1a1d21;
    --text-dim:#6b7280;
    --accent:#00952b;
    --accent-dim:#00611c;
    --good:#2e8b47;
  }
  html{transition:background .2s ease;}
  body{transition:background .2s ease, color .2s ease;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{
    min-height:100vh;
    padding-bottom:40px;
  }
  .logo-wrap{
    display:flex;justify-content:center;align-items:center;
    padding:18px 20px 4px;
  }
  .logo-wrap img{
    max-width:220px;width:100%;height:auto;display:block;
  }
  .settings-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px 0;
  }
  .lang-toggle{
    display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:2px;
  }
  .lang-btn{
    padding:5px 11px;border-radius:6px;border:none;background:transparent;
    color:var(--text-dim);font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
    letter-spacing:.03em;cursor:pointer;
  }
  .lang-btn.active{background:var(--accent);color:#fff;}
  .theme-btn{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:15px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    padding:0;
  }
  .theme-btn:active{opacity:.8;}
  .topbar{
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:8px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .topbar .mark{
    width:34px;height:34px;border-radius:8px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;color:#15171b;
    flex-shrink:0;
  }
  .topbar h1{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;
    letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--text);
    text-align:center;
  }
  .topbar .titlebox{text-align:center;}
  .topbar span{display:block;font-size:11.5px;color:var(--text-dim);margin-top:1px;}

  .gauge-wrap{
    padding:26px 20px 8px;
    display:flex;flex-direction:column;align-items:center;
  }
  .gauge{position:relative;width:260px;height:150px;}
  .gauge svg{width:100%;height:100%;display:block;}
  .gauge-readout{
    position:absolute;bottom:2px;left:0;right:0;
    text-align:center;
  }
  .gauge-readout .val{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:44px;
    color:var(--accent); line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .gauge-readout .unit{
    font-family:'Inter',sans-serif;font-size:12px;color:var(--text-dim);
    letter-spacing:.08em;text-transform:uppercase;margin-top:2px;
  }
  .subreadout{
    display:flex;gap:22px;justify-content:center;margin-top:6px;
  }
  .subreadout div{text-align:center;}
  .subreadout .n{
    font-family:'Roboto Mono',monospace;font-weight:500;font-size:15px;color:var(--text);
  }
  .subreadout .l{
    font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;
  }

  .tabs{
    display:flex;gap:8px;padding:14px 20px 0;
  }
  .tab-btn{
    flex:1;padding:11px 8px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--text-dim);
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    letter-spacing:.02em;text-align:center;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .tab-icon{
    width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0;
    background:#fff;
  }
  .tab-swatches{display:flex;gap:3px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .tab-dot{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,.25);flex-shrink:0;}
  #tabColorati{flex-direction:column;gap:4px;}
  .tab-btn.active{
    background:var(--accent);border-color:var(--accent);color:#0d1a10;
  }
  .tab-btn:active{opacity:.85;}

  .section{padding:18px 20px 4px;}
  .section h2{
    font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--text-dim);margin:0 0 10px;font-weight:500;
  }

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:14px;
  }
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;
  }
  .field .input-row{display:flex;align-items:center;gap:8px;}
  .field input[type=number]{
    flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-family:'Roboto Mono',monospace;font-size:17px;font-weight:500;
    padding:11px 12px;width:100%;outline:none;
  }
  .field input[type=number]:focus{border-color:var(--accent);}
  .field .u{font-size:12px;color:var(--text-dim);min-width:44px;}

  .nozzle-grid{display:flex;flex-direction:column;gap:8px;}
  .nozzle-row{
    display:grid;grid-template-columns:1fr 1fr 74px;gap:8px;align-items:center;
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:9px 10px;
  }
  .nozzle-row.active{border-color:var(--accent-dim);}
  .nozzle-meta{display:flex;flex-direction:row;align-items:center;gap:8px;}
  .nozzle-meta .swatch{
    width:16px;height:16px;border-radius:50%;flex-shrink:0;
    border:1px solid rgba(255,255,255,.25);
  }
  .nozzle-meta .text-col{display:flex;flex-direction:column;gap:1px;}
  .nozzle-icon{
    width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;
    background:#fff;
  }
  .nozzle-icons{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .nozzle-meta .top{font-family:'Roboto Mono',monospace;font-size:13.5px;color:var(--text);}
  .nozzle-meta .bot{font-size:10.5px;color:var(--text-dim);}
  .nozzle-flow{text-align:right;}
  .nozzle-flow .fv{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--text-dim);}
  .nozzle-flow .fl{font-size:9.5px;color:var(--text-dim);}
  .nozzle-row input[type=number]{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-family:'Roboto Mono',monospace;font-size:15px;font-weight:500;
    padding:8px;width:100%;text-align:center;outline:none;
  }
  .nozzle-row input[type=number]:focus{border-color:var(--accent);}

  .footer-note{
    padding:14px 20px 4px;font-size:11.5px;color:var(--text-dim);line-height:1.5;
  }
  .footer-note b{color:var(--text);}

  .reset-btn{
    margin:16px 20px 0;padding:12px;width:calc(100% - 40px);
    background:transparent;border:1px solid var(--line);border-radius:10px;
    color:var(--text-dim);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    letter-spacing:.02em;
  }
  .reset-btn:active{background:var(--panel-2);}
  #gaugeTrack{stroke:var(--line);}

  /* ===== Preset, configurazioni salvate, portagetto doppio ===== */
  .cfg-select,.cfg-input{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-family:'Inter',sans-serif;font-size:14px;
    padding:11px 12px;outline:none;min-width:0;
  }
  .cfg-select:focus,.cfg-input:focus{border-color:var(--accent);}
  .cfg-row{display:flex;gap:8px;align-items:stretch;}
  .cfg-row > .cfg-select,.cfg-row > .cfg-input{flex:1;}
  .cfg-btn{
    padding:0 14px;min-height:42px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-family:'Inter',sans-serif;
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .cfg-btn:active{opacity:.8;}
  .cfg-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .cfg-btn.danger{color:#ef4444;}
  .cfg-desc{font-size:11.5px;color:var(--text-dim);line-height:1.5;white-space:pre-line;margin-top:4px;}
  .cfg-desc:empty{display:none;}
  .cfg-msg{font-size:12px;margin-top:10px;line-height:1.4;}
  .cfg-msg:empty{display:none;}
  .cfg-msg.ok{color:var(--good);}
  .cfg-msg.err{color:#ef4444;}
  .toggle-row{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer;line-height:1.35;}
  .toggle-row input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0;margin:0;}
  .series-tabs{display:flex;gap:8px;margin-top:12px;}
  .series-btn{
    flex:1;padding:10px 8px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-family:'Inter',sans-serif;
    text-align:center;display:flex;flex-direction:column;gap:2px;cursor:pointer;
  }
  .series-btn.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .series-btn .s-name{font-weight:700;font-size:13px;}
  .series-btn .s-dose{font-size:11px;color:var(--text-dim);}
  .series-btn .s-press{font-family:'Roboto Mono',monospace;font-size:14px;font-weight:500;}
  .serie-badge{
    display:inline-block;margin-bottom:10px;padding:4px 10px;border-radius:999px;
    background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.02em;
  }
  .serie-badge[hidden]{display:none;}

  /* ===== Report PDF ===== */
  #reportView{position:fixed;inset:0;z-index:1000;background:#fff;color:#111;overflow:auto;font-family:'Inter',sans-serif;}
  #reportView .r-bar{position:sticky;top:0;display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;background:#f1f3f5;border-bottom:1px solid #d5d9de;}
  #reportView .r-btn{padding:10px 16px;border-radius:9px;border:1px solid #c5cad1;background:#fff;color:#111;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
  #reportView .r-btn.primary{background:#00952b;border-color:#00952b;color:#fff;}
  #reportView .r-page{max-width:800px;margin:0 auto;padding:22px 22px 40px;}
  #reportView .r-head{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:3px solid #00952b;padding-bottom:12px;margin-bottom:16px;}
  #reportView .r-head img{max-width:150px;height:auto;display:block;}
  #reportView .r-title{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px;}
  #reportView .r-meta{font-size:12px;color:#555;line-height:1.5;}
  #reportView .r-series{border:1px solid #d5d9de;border-radius:10px;padding:14px;margin-bottom:16px;break-inside:avoid;page-break-inside:avoid;}
  #reportView .r-series h3{font-family:'Oswald',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px;color:#00611c;}
  #reportView .r-fam{font-size:12px;color:#555;margin-bottom:10px;}
  #reportView .r-kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
  #reportView .r-kv div{background:#f4f5f7;border-radius:8px;padding:8px 10px;}
  #reportView .r-kv b{display:block;font-size:15px;font-family:'Roboto Mono',monospace;font-weight:500;}
  #reportView .r-kv span{font-size:10.5px;color:#555;}
  #reportView .r-sub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#555;margin:0 0 6px;}
  #reportView table{width:100%;border-collapse:collapse;font-size:12.5px;}
  #reportView th,#reportView td{padding:6px 8px;border-bottom:1px solid #e3e6ea;text-align:left;vertical-align:middle;}
  #reportView th{font-size:11px;color:#555;font-weight:600;}
  #reportView .num{text-align:right;font-family:'Roboto Mono',monospace;}
  #reportView tfoot td{font-weight:700;border-bottom:none;}
  #reportView .r-sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid rgba(0,0,0,.3);}
  #reportView .r-press{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;border-radius:8px;border:2px solid;}
  #reportView .r-press span{font-size:13px;font-weight:600;}
  #reportView .r-press b{font-family:'Oswald',sans-serif;font-size:26px;}
  #reportView .r-warn{font-size:11.5px;margin-top:6px;color:#b45309;}
  #reportView .r-foot{font-size:10.5px;color:#666;margin-top:6px;border-top:1px solid #ddd;padding-top:8px;line-height:1.5;}
  @media (max-width:520px){#reportView .r-kv{grid-template-columns:repeat(2,1fr);}#reportView .r-head{flex-direction:column;align-items:flex-start;}}
  @media print{
    body > *:not(#reportView){display:none !important;}
    #reportView{position:static;overflow:visible;}
    #reportView .r-bar{display:none;}
    #reportView .r-page{padding:0;max-width:none;}
    #reportView *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    @page{margin:12mm;}
  }

  /* ===== Layout responsive =====
     Mobile/tablet: colonna singola (max 720px, centrata).
     Desktop (>=1100px): schermo intero, contenuti in colonne affiancate, senza scorrere. */
  .app-head,.layout{width:100%;max-width:720px;margin:0 auto;}
  @media (min-width:1100px){
    .app-head{max-width:1900px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 24px;border-bottom:1px solid var(--line);}
    .settings-bar{display:contents;}
    .lang-toggle{grid-column:1;grid-row:1;justify-self:start;}
    .theme-btn{grid-column:3;grid-row:1;justify-self:end;}
    .head-center{grid-column:2;grid-row:1;display:flex;align-items:center;gap:22px;}
    .head-center .logo-wrap{padding:4px 0;}
    .head-center .logo-wrap img{max-width:150px;}
    .head-center .topbar{padding:0;border-bottom:none;}
    .layout{max-width:1900px;padding:0 24px 20px;}
    .layout .section{padding:12px 0 0;}
    .card{padding:16px;margin-bottom:12px;}
    body{padding-bottom:0;}
  }
  /* menu a tendina coerenti su tutti i browser (desktop incluso) */
  .cfg-select{
    appearance:none;-webkit-appearance:none;-moz-appearance:none;cursor:pointer;padding-right:36px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa1ab' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;
    text-overflow:ellipsis;white-space:nowrap;overflow:hidden;
  }
  .cfg-select option,.cfg-select optgroup{background:var(--panel);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
  .cfg-select optgroup{font-weight:700;font-style:normal;}
  @media (hover:hover){
    .cfg-btn:hover,.seg-btn:hover,.alt:hover,.series-btn:hover,.lang-btn:hover,.theme-btn:hover,.cfg-select:hover{border-color:var(--accent);}
    .cfg-btn.primary:hover,.seg-btn.active:hover{filter:brightness(1.1);}
  }
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ===== Finestra di conferma interna (al posto di confirm(), bloccato in anteprime/iframe) ===== */
  .dlg-ov{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;}
  .dlg{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.45);}
  .dlg-msg{font-size:14.5px;line-height:1.5;margin-bottom:18px;word-break:break-word;}
  .dlg-btns{display:flex;gap:10px;justify-content:flex-end;}
  .dlg-btns .cfg-btn{min-width:96px;}
  .cfg-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* layout index: mobile = ordine originale; desktop = 3 colonne */
  .layout{display:flex;flex-direction:column;}
  .col{display:contents;}
  .gauge-wrap{order:1;} #secCfg{order:2;} #secDual{order:3;} .tabs{order:4;}
  #secDati{order:5;} #secUgelli{order:6;} #footerNote{order:7;} #resetBtn{order:8;}
  @media (min-width:1100px){
    .layout{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr) minmax(320px,400px);gap:0 24px;align-items:start;}
    .col{display:block;}
    .gauge-wrap,#secCfg,#secDual,.tabs,#secDati,#secUgelli,#footerNote,#resetBtn{order:0;}
    .gauge-wrap{padding:14px 0 4px;}
    .tabs{padding:12px 0 0;}
    #resetBtn{margin:10px 0 0;width:100%;}
    #footerNote{padding:14px 0 0;}
  }

  /* ===== Tab ugelli: ISO di default e più grande; animazione al cambio ===== */
  .tabs{align-items:center;min-height:96px;}
  .tab-btn{
    flex:1 1 0;min-width:0;padding:10px 8px;opacity:.85;
    transition:flex-grow .45s cubic-bezier(.4,0,.2,1),padding .4s ease,background-color .3s ease,color .3s ease,border-color .3s ease,opacity .3s ease,box-shadow .4s ease,gap .4s ease;
  }
  .tab-btn.active{flex-grow:1.55;padding:18px 10px;opacity:1;box-shadow:0 6px 20px rgba(0,149,43,.30);animation:tabPop .5s cubic-bezier(.3,1.4,.5,1);}
  @keyframes tabPop{0%{transform:scale(.94);}100%{transform:scale(1);}}
  .tab-btn > *{transition:transform .4s cubic-bezier(.4,0,.2,1);transform-origin:center;}
  .tab-btn:not(.active) > *{transform:scale(.9);}
  .tab-icon{transition:width .4s ease,height .4s ease;}
  .tab-btn.active .tab-icon{width:22px;height:22px;}
  #tabRosaLabel{font-size:12.5px;transition:font-size .4s ease;}
  #tabRosa.active #tabRosaLabel{font-size:14.5px;}
  #tabColoratiLabel span[style*="11px"]{max-height:44px;overflow:hidden;transition:max-height .4s ease,opacity .3s ease;}
  #tabColorati:not(.active) #tabColoratiLabel span[style*="11px"]{max-height:0;opacity:0 !important;}
  #tabColorati:not(.active){gap:0;}
  #tabColorati .tab-swatches{max-height:24px;overflow:hidden;transition:max-height .4s ease,opacity .3s ease;}
  #tabColorati:not(.active) .tab-swatches{max-height:0;opacity:0;}
  @media (prefers-reduced-motion:reduce){.tab-btn,.tab-btn *{transition:none !important;animation:none !important;}}
</style>
</head>
<body>

<header class="app-head">
<div class="settings-bar">
  <div class="lang-toggle">
    <button class="lang-btn active" id="langIt">IT</button>
    <button class="lang-btn" id="langEn">EN</button>
    <button class="lang-btn" id="langEs">ES</button>
    <button class="lang-btn" id="langDe">DE</button>
    <button class="lang-btn" id="langFr">FR</button>
  </div>
  <button class="theme-btn" id="themeToggle" aria-label="Cambia tema" title="Cambia tema">🌙</button>
</div>

function renderGrid(mode, counts){
  const cfg = DATASETS[mode];
  const t = I18N[currentLang];
  grid.innerHTML = '';
  cfg.nozzles.forEach((n, i) => {
    const row = document.createElement('div');
    row.className = 'nozzle-row';
    row.id = 'row-' + i;
    const swatch = n.color ? `<div class="swatch" style="background:${n.color}"></div>` : '';
    const label = cfg.hasConv ? `Ø ${n.ugello} mm` : `${t.ugello} ${n.ugello}`;
    const sub = cfg.hasConv ? `<div class="bot">${t.convoglLabel(n.conv)}</div>` : '';
    let icons = '';
    if (cfg.hasConv) {
      const convIcon = n.conv === 'cieco' ? ICON_CIECO : ICON_CONVOGLIATORE;
      const convAlt = n.conv === 'cieco' ? t.cieco : t.convogliatore;
      icons = `
        <div class="nozzle-icons">
          <img class="nozzle-icon" src="${ICON_UGELLO_ROSA}" alt="${t.ugelloRosaAlt}">
          <img class="nozzle-icon" src="${convIcon}" alt="${convAlt}">
        </div>`;
    }
    row.innerHTML = `
      <div class="nozzle-meta">
        ${swatch}
        ${icons}
        <div class="text-col">
          <div class="top">${label}</div>
          ${sub}
        </div>
      </div>
      <div class="nozzle-flow">
        <div class="fv">${n.lmin.toFixed(2)} l/min</div>
        <div class="fl">${t.aBar(cfg.refBar)}</div>
      </div>
      <input type="number" id="getti-${i}" inputmode="numeric" placeholder="0" value="${(counts && counts[i]) || 0}" min="0" step="1">
    `;
    grid.appendChild(row);
  });
}

const lminVal = document.getElementById('lminVal');
const gettiVal = document.getElementById('gettiVal');
const arc = document.getElementById('arc');
const ARC_LEN = 345;

function getGaugeColor(pressione){
  if (pressione < 2) return '#ef4444';
  if (pressione < 4) return '#f59e0b';
  if (pressione < 12) return '#22c55e';
  if (pressione < 20) return '#f59e0b';
  return '#ef4444';
}

function getGettiInputs(){
  return DATASETS[currentMode].nozzles.map((_, i) => document.getElementById('getti-' + i));
}

function recalc(){
  const cfg = DATASETS[currentMode];
  const lha = parseFloat(lhaEl.value) || 0;
  const vel = parseFloat(velEl.value) || 0;
  const fil = parseFloat(filEl.value) || 0;

  const inputs = getGettiInputs();
  const counts = inputs.map(inp => parseFloat(inp.value) || 0);
  const { lminTotali, totGetti, pressione } = calcPressure(cfg, lha, vel, fil, counts);
  cfg.nozzles.forEach((n, i) => {
    document.getElementById('row-' + i).classList.toggle('active', counts[i] > 0);
  });

  lminVal.textContent = lminTotali.toFixed(2);
  gettiVal.textContent = totGetti;

  if (pressione !== null) {
    pressureVal.textContent = pressione < 100 ? pressione.toFixed(2) : pressione.toFixed(0);
    arc.style.stroke = getGaugeColor(pressione);
    const frac = Math.min(pressione / cfg.gaugeMax, 1);
    arc.style.strokeDashoffset = ARC_LEN - (ARC_LEN * frac);
  } else {
    pressureVal.textContent = '–';
    arc.style.stroke = '#00952b';
    arc.style.strokeDashoffset = ARC_LEN;
  }

  syncSeriesFromUI();
  renderDualSummary();
}

document.body.addEventListener('input', recalc);

});

// ---- Funzioni di calcolo "pure" (stessa formula di recalc) -------------
function calcPressure(cfg, lha, vel, fil, counts){
  const lminTotali = (lha * vel * fil) / 600;
  let sumDG = 0, totGetti = 0;
  cfg.nozzles.forEach((n, i) => {
    const g = Math.max(0, parseFloat(counts[i]) || 0);
    sumDG += g * n.lmin;
    totGetti += g;
  });
  let pressione = null;
  if (sumDG > 0 && lminTotali > 0) {
    pressione = cfg.refBar * (lminTotali * lminTotali) / (sumDG * sumDG);
  }
  return { lminTotali, sumDG, totGetti, pressione };
}
function fmtP(p){ return p < 100 ? p.toFixed(2) : p.toFixed(0); }

// ---- Stato: una o due "serie" di ugelli --------------------------------
function blankSeries(mode){
  mode = mode || 'colorati';
  return { mode, lha:0, vel:0, fil:0, counts: DATASETS[mode].nozzles.map(() => 0) };
}
function cloneSeries(s){ return { mode:s.mode, lha:s.lha, vel:s.vel, fil:s.fil, counts:s.counts.slice() }; }
function seriesIsBlank(s){ return !s.lha && !s.vel && !s.fil && s.counts.every(c => !c); }

// Legge lo stato attuale dei campi (serie attiva) e lo memorizza.
function syncSeriesFromUI(){
  const num = el => Math.max(0, parseFloat(el.value) || 0);
  cfgState.series[cfgState.active] = {
    mode: currentMode, lha: num(lhaEl), vel: num(velEl), fil: num(filEl),
    counts: getGettiInputs().map(num)
  };
}

// Carica una serie nei campi esistenti (tab, dati trattamento, getti).
function loadSeriesToUI(s){
  currentMode = s.mode;
  tabRosa.classList.toggle('active', s.mode === 'rosa');
  tabColorati.classList.toggle('active', s.mode === 'colorati');
  renderGrid(s.mode, s.counts);
  lhaEl.value = s.lha; velEl.value = s.vel; filEl.value = s.fil;
  recalc();
}

function applyConfig(cfg){
  cfgState.dual = !!cfg.dual;
  cfgState.series = [cloneSeries(cfg.series[0]), cfg.series[1] ? cloneSeries(cfg.series[1]) : blankSeries(cfg.series[0].mode)];
  cfgState.active = 0;
  dualToggle.checked = cfgState.dual;
  loadSeriesToUI(cfgState.series[0]);
}

function selectSeries(i){
  if (i === cfgState.active) return;
  syncSeriesFromUI();
  cfgState.active = i;
  loadSeriesToUI(cfgState.series[i]);
}

// Riepilogo delle due serie (chiamato a ogni ricalcolo).
function renderDualSummary(){
  dualBody.hidden = !cfgState.dual;
  serieBadge.hidden = !cfgState.dual;
  if (!cfgState.dual) return;
  const names = [ct('serieA'), ct('serieB')];
  serieBadge.textContent = ct('editing')(names[cfgState.active]);
  [0, 1].forEach(i => {
    const s = cfgState.series[i];
    const r = calcPressure(DATASETS[s.mode], s.lha, s.vel, s.fil, s.counts);
    const btn = serieBtns[i];
    btn.classList.toggle('active', i === cfgState.active);
    btn.querySelector('.s-name').textContent = names[i];
    btn.querySelector('.s-dose').textContent = `${s.lha} l/ha`;
    const p = btn.querySelector('.s-press');
    if (r.pressione == null) { p.textContent = '– bar'; p.style.color = ''; }
    else { p.textContent = fmtP(r.pressione) + ' bar'; p.style.color = getGaugeColor(r.pressione); }
  });
}

dualToggle.addEventListener('change', () => {
  syncSeriesFromUI();
  cfgState.dual = dualToggle.checked;
  if (cfgState.dual) {
    // Prima attivazione: la serie B parte come copia della A, da modificare.
    if (seriesIsBlank(cfgState.series[1])) cfgState.series[1] = cloneSeries(cfgState.series[0]);
  } else if (cfgState.active !== 0) {
    cfgState.active = 0;
    loadSeriesToUI(cfgState.series[0]);
  }
  renderDualSummary();
});

function newId(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function sanitizeSeries(s){
  if (!s || typeof s !== 'object' || !DATASETS[s.mode]) return null;
  const num = v => { v = parseFloat(v); return isFinite(v) && v > 0 ? v : 0; };
  const n = DATASETS[s.mode].nozzles.length;
  return { mode:s.mode, lha:num(s.lha), vel:num(s.vel), fil:num(s.fil),
           counts: Array.from({length:n}, (_, i) => num(Array.isArray(s.counts) ? s.counts[i] : 0)) };
}
function sanitizeConfig(o){
  if (!o || typeof o !== 'object' || typeof o.name !== 'string' || !o.name.trim() || !Array.isArray(o.series)) return null;
  const a = sanitizeSeries(o.series[0]);
  if (!a) return null;
  const b = o.dual ? sanitizeSeries(o.series[1]) : null;
  const dual = !!(o.dual && b);
  return { id: (typeof o.id === 'string' && o.id) ? o.id : newId(), name:o.name.trim().slice(0, 60),
           dual, series: dual ? [a, b] : [a], savedAt: Number(o.savedAt) || Date.now() };
}

// ---- Archivio locale (localStorage, per dispositivo/browser) -----------
function loadSaved(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.map(sanitizeConfig).filter(Boolean) : [];
  } catch (e) { return []; }
}
function persistSaved(list){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); return true; }
  catch (e) { return false; }
}
let savedConfigs = loadSaved();

let msgTimer = null;
function showMsg(text, isErr){
  cfgMsg.textContent = text;
  cfgMsg.className = 'cfg-msg ' + (isErr ? 'err' : 'ok');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { cfgMsg.textContent = ''; }, 6000);
}

// ---- Testi descrittivi -------------------------------------------------
function nozzleSummary(s){
  const cfg = DATASETS[s.mode], t = I18N[currentLang];
  return cfg.nozzles.map((n, i) => {
    if (!(s.counts[i] > 0)) return null;
    if (!cfg.hasConv) return `${s.counts[i]}× ${n.ugello}`;
    return n.conv === 'cieco'
      ? `${s.counts[i]}× Ø${n.ugello} ${t.cieco}`
      : `${s.counts[i]}× Ø${n.ugello} + ${t.convogl} ${n.conv}`;
  }).filter(Boolean).join(' + ');
}
function describeConfig(cfg){
  return (cfg.dual ? [0, 1] : [0]).map(i => {
    const s = cfg.series[i];
    const r = calcPressure(DATASETS[s.mode], s.lha, s.vel, s.fil, s.counts);
    const label = cfg.dual ? (i === 0 ? ct('serieA') : ct('serieB')) + ': ' : '';
    return `${label}${s.lha} l/ha · ${s.vel} km/h · ${s.fil} m · ${nozzleSummary(s)} → ${r.pressione == null ? '–' : fmtP(r.pressione)} bar`;
  }).join('\n');
}


// ---- Conferma interna (confirm() è bloccato in alcune anteprime/iframe e fallisce in silenzio) ----
const DLG_I18N = {
  it:{ cancel:'Annulla', overwriteBtn:'Sovrascrivi' }, en:{ cancel:'Cancel', overwriteBtn:'Overwrite' },
  es:{ cancel:'Cancelar', overwriteBtn:'Sobrescribir' }, de:{ cancel:'Abbrechen', overwriteBtn:'Überschreiben' },
  fr:{ cancel:'Annuler', overwriteBtn:'Écraser' }
};
Object.keys(DLG_I18N).forEach(l => Object.assign(CFG_I18N[l], DLG_I18N[l]));
function askConfirm(message, okLabel, cancelLabel){
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'dlg-ov';
    ov.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><div class="dlg-msg"></div><div class="dlg-btns">' +
      '<button type="button" class="cfg-btn" data-r="0"></button><button type="button" class="cfg-btn danger" data-r="1"></button></div></div>';
    ov.querySelector('.dlg-msg').textContent = message;
    const [bNo, bYes] = ov.querySelectorAll('button');
    bNo.textContent = cancelLabel; bYes.textContent = okLabel;
    const done = v => { document.removeEventListener('keydown', onKey); ov.remove(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(false); };
    bNo.addEventListener('click', () => done(false));
    bYes.addEventListener('click', () => done(true));
    ov.addEventListener('click', e => { if (e.target === ov) done(false); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    bNo.focus();
  });
}

// ---- Interfaccia selezione preset / salvate ----------------------------
function mkOpt(value, text){
  const o = document.createElement('option');
  o.value = value; o.textContent = text;
  return o;
}
function renderPresetSelect(){
  const keep = presetSelect.value;
  presetSelect.innerHTML = '';
  presetSelect.appendChild(mkOpt('', ct('presetPlaceholder')));
  const groups = { vigneto: ct('gVigneto'), frutteto: ct('gFrutteto'), dual: ct('gDual') };
  Object.keys(groups).forEach(g => {
    const og = document.createElement('optgroup');
    og.label = groups[g];
    PRESETS.filter(p => p.group === g).forEach(p => og.appendChild(mkOpt(p.id, p.name[currentLang] || p.name.it)));
    presetSelect.appendChild(og);
  });
  presetSelect.value = keep;
}
function renderSavedSelect(selectId){
  const keep = selectId !== undefined ? selectId : savedSelect.value;
  savedSelect.innerHTML = '';
  savedSelect.appendChild(mkOpt('', savedConfigs.length ? ct('savedPlaceholder') : ct('savedEmpty')));
  savedConfigs.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(c => {
    savedSelect.appendChild(mkOpt(c.id, c.name + (c.dual ? ' (A/B)' : '')));
  });
  savedSelect.value = keep || '';
  if (savedSelect.value !== (keep || '')) savedSelect.value = '';
}
function renderCfgUI(){
  document.getElementById('lblCfgTitle').textContent  = ct('cfgTitle');
  document.getElementById('lblPreset').textContent    = ct('preset');
  document.getElementById('lblSavedCfg').textContent  = ct('lblSaved');
  document.getElementById('lblCfgName').textContent   = ct('saveLbl');
  document.getElementById('lblDualTitle').textContent = ct('dualTitle');
  document.getElementById('lblDual').textContent      = ct('dual');
  document.getElementById('dualHint').textContent     = ct('dualHint');
  document.getElementById('cfgDelete').textContent    = ct('del');
  document.getElementById('cfgSave').textContent      = ct('save');
  document.getElementById('cfgExport').textContent    = ct('exp');
  document.getElementById('cfgImport').textContent    = ct('imp');
  document.getElementById('cfgReport').textContent    = ct('btnReport');
  cfgName.placeholder = ct('namePh');
  renderPresetSelect();
  renderSavedSelect();
  showDescForSelection();
  renderDualSummary();
}
function showDescForSelection(){
  document.getElementById('cfgDelete').disabled = !savedSelect.value;
  const p = PRESETS.find(x => x.id === presetSelect.value);
  const c = savedConfigs.find(x => x.id === savedSelect.value);
  if (p) cfgDesc.textContent = describeConfig(p) + '\n' + ct('presetNote');
  else if (c) cfgDesc.textContent = describeConfig(c);
  else cfgDesc.textContent = '';
}

presetSelect.addEventListener('change', () => {
  const p = PRESETS.find(x => x.id === presetSelect.value);
  savedSelect.value = '';
  if (p) {
    applyConfig(p);
    cfgName.value = p.name[currentLang] || p.name.it;
  }
  showDescForSelection();
});
savedSelect.addEventListener('change', () => {
  const c = savedConfigs.find(x => x.id === savedSelect.value);
  presetSelect.value = '';
  if (c) {
    applyConfig(c);
    cfgName.value = c.name;
  }
  showDescForSelection();
});

// ---- Salva / elimina / esporta / importa -------------------------------
document.getElementById('cfgSave').addEventListener('click', async () => {
  syncSeriesFromUI();
  const name = cfgName.value.trim();
  if (!name) return showMsg(ct('nameRequired'), true);
  const used = (cfgState.dual ? [0, 1] : [0]).some(i => cfgState.series[i].counts.some(c => c > 0));
  if (!used) return showMsg(ct('needNozzles'), true);
  const cfg = sanitizeConfig({ name, dual:cfgState.dual, series: cfgState.dual ? cfgState.series : [cfgState.series[0]] });
  const idx = savedConfigs.findIndex(c => c.name.toLowerCase() === cfg.name.toLowerCase());
  if (idx >= 0) {
    if (!(await askConfirm(ct('overwrite')(savedConfigs[idx].name), ct('overwriteBtn'), ct('cancel')))) return;
    cfg.id = savedConfigs[idx].id;
    savedConfigs[idx] = cfg;
  } else {
    savedConfigs.push(cfg);
  }
  if (persistSaved(savedConfigs)) showMsg(ct('msgSaved'), false);
  else showMsg(ct('storageErr'), true);
  presetSelect.value = '';
  renderSavedSelect(cfg.id);
  showDescForSelection();
});

document.getElementById('cfgDelete').addEventListener('click', async () => {
  const c = savedConfigs.find(x => x.id === savedSelect.value);
  if (!c) return showMsg(ct('selectToDelete'), true);
  if (!(await askConfirm(ct('delConfirm')(c.name), ct('del'), ct('cancel')))) return;
  savedConfigs = savedConfigs.filter(x => x.id !== c.id);
  if (!persistSaved(savedConfigs)) showMsg(ct('storageErr'), true);
  else showMsg(ct('msgDeleted'), false);
  renderSavedSelect('');
  showDescForSelection();
});

document.getElementById('cfgExport').addEventListener('click', () => {
  if (!savedConfigs.length) return showMsg(ct('nothingExport'), true);
  const data = JSON.stringify({ app:'caffini-pressione', version:1, configs:savedConfigs }, null, 2);
  const url = URL.createObjectURL(new Blob([data], { type:'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'caffini-configurazioni-ugelli.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

const cfgFile = document.getElementById('cfgFile');
document.getElementById('cfgImport').addEventListener('click', () => cfgFile.click());
cfgFile.addEventListener('change', () => {
  const f = cfgFile.files && cfgFile.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const list = Array.isArray(parsed) ? parsed : (parsed && parsed.configs);
      if (!Array.isArray(list)) throw new Error('format');
      const valid = list.map(sanitizeConfig).filter(Boolean);
      if (!valid.length) throw new Error('empty');
      valid.forEach(c => {
        const i = savedConfigs.findIndex(x => x.id === c.id || x.name.toLowerCase() === c.name.toLowerCase());
        if (i >= 0) { c.id = savedConfigs[i].id; savedConfigs[i] = c; } else savedConfigs.push(c);
      });
      if (!persistSaved(savedConfigs)) showMsg(ct('storageErr'), true);
      else showMsg(ct('msgImported')(valid.length), false);
      renderSavedSelect();
    } catch (e) {
      showMsg(ct('importErr'), true);
    }
    cfgFile.value = '';
  };
  reader.onerror = () => { showMsg(ct('importErr'), true); cfgFile.value = ''; };
  reader.readAsText(f);
});

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function reportSeriesHTML(i){
  const s = cfgState.series[i], cfg = DATASETS[s.mode], t = I18N[currentLang];
  const r = calcPressure(cfg, s.lha, s.vel, s.fil, s.counts);
  const rows = cfg.nozzles.map((n, k) => {
    const g = Math.max(0, s.counts[k] || 0);
    if (!(g > 0)) return '';
    const label = cfg.hasConv ? `Ø ${n.ugello} mm` : `${t.ugello} ${n.ugello}`;
    const sw = n.color ? `<span class="r-sw" style="background:${n.color}"></span>` : '';
    const conv = cfg.hasConv ? `<td>${esc(t.convoglLabel(n.conv))}</td>` : '';
    return `<tr><td>${sw}${esc(label)}</td>${conv}<td class="num">${g}</td><td class="num">${n.lmin.toFixed(2)}</td><td class="num">${(g * n.lmin).toFixed(2)}</td></tr>`;
  }).join('');
  const convTh = cfg.hasConv ? `<th>${esc(t.convogliatore.charAt(0).toUpperCase() + t.convogliatore.slice(1))}</th>` : '';
  const emptyCols = cfg.hasConv ? 2 : 1;
  const fam = s.mode === 'rosa' ? ct('famRosa') : ct('famIso');
  const title = cfgState.dual ? `<h3>${esc(i === 0 ? ct('serieA') : ct('serieB'))}</h3>` : '';
  let press = '';
  if (r.pressione != null) {
    const col = getGaugeColor(r.pressione);
    const out = r.pressione < 4 || r.pressione >= 12;
    press = `<div class="r-press" style="border-color:${col}"><span>${esc(ct('rPressure'))} </span><b style="color:${col}">${fmtP(r.pressione)} bar</b></div>`
          + (out ? `<div class="r-warn">⚠ ${esc(ct('rWarn'))}</div>` : '');
  }
  return `<div class="r-series">${title}
    <div class="r-fam">${esc(ct('rFamily'))}: ${esc(fam)}</div>
    <div class="r-kv">
      <div><b>${s.lha}</b><span>${esc(t.dose)} (l/ha)</span></div>
      <div><b>${s.vel}</b><span>${esc(t.velocita)} (km/h)</span></div>
      <div><b>${s.fil}</b><span>${esc(t.filari)} (m)</span></div>
      <div><b>${r.lminTotali.toFixed(2)}</b><span>${esc(t.lminTotali)}</span></div>
    </div>
    <div class="r-sub">${esc(ct('rNozzlesTitle'))}</div>
    <table>
      <thead><tr><th>${esc(ct('rNozzle'))}</th>${convTh}<th class="num">${esc(ct('rJets'))}</th><th class="num">${esc(ct('rFlow'))} @ ${cfg.refBar} bar</th><th class="num">${esc(ct('rLminRow'))}</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="${emptyCols + 3}">–</td></tr>`}</tbody>
      <tfoot><tr><td colspan="${emptyCols}">${esc(ct('rTotal'))}</td><td class="num">${r.totGetti}</td><td></td><td class="num">${r.sumDG.toFixed(2)}</td></tr></tfoot>
    </table>
    ${press}
  </div>`;
}

let reportPrevTitle = null;
function closeReport(){
  const v = document.getElementById('reportView');
  if (v) v.remove();
  document.removeEventListener('keydown', reportKeyHandler);
  if (reportPrevTitle !== null) { document.title = reportPrevTitle; reportPrevTitle = null; }
}
function reportKeyHandler(e){ if (e.key === 'Escape') closeReport(); }

function openReport(){
  syncSeriesFromUI();
  const idxs = cfgState.dual ? [0, 1] : [0];
  if (!idxs.some(i => cfgState.series[i].counts.some(c => c > 0))) return showMsg(ct('needNozzles'), true);
  closeReport();
  const locale = { it:'it-IT', en:'en-GB', es:'es-ES', de:'de-DE', fr:'fr-FR' }[currentLang] || 'it-IT';
  const now = new Date();
  const dateStr = now.toLocaleDateString(locale) + ' ' + now.toLocaleTimeString(locale, { hour:'2-digit', minute:'2-digit' });
  const name = cfgName.value.trim();
  const logo = document.querySelector('.logo-wrap img');
  const logoHtml = logo && logo.src ? `<img src="${esc(logo.src)}" alt="CAFFINI">` : '';
  const v = document.createElement('div');
  v.id = 'reportView';
  v.innerHTML = `
    <div class="r-bar">
      <button type="button" class="r-btn" id="rClose">${esc(ct('rClose'))}</button>
      <button type="button" class="r-btn primary" id="rPrint">${esc(ct('rPrint'))}</button>
    </div>
    <div class="r-page">
      <div class="r-head">
        <div>
          <h1 class="r-title">${esc(ct('reportTitle'))}</h1>
          <div class="r-meta">${name ? esc(ct('rConfig')) + ': <b>' + esc(name) + '</b><br>' : ''}${esc(ct('rDate'))}: ${esc(dateStr)}</div>
        </div>
        ${logoHtml}
      </div>
      ${idxs.map(reportSeriesHTML).join('')}
      <div class="r-foot">${esc(ct('rNote'))}</div>
    </div>`;
  document.body.appendChild(v);
  v.scrollTop = 0;
  // il titolo diventa il nome file proposto dal browser per il PDF
  reportPrevTitle = document.title;
  const safe = (name || 'report').replace(/[^\w\-]+/g, '_').slice(0, 40);
  document.title = 'CAFFINI_' + safe + '_' + now.toISOString().slice(0, 10);
  document.getElementById('rClose').addEventListener('click', closeReport);
  document.getElementById('rPrint').addEventListener('click', () => window.print());
  document.addEventListener('keydown', reportKeyHandler);
}
document.getElementById('cfgReport').addEventListener('click', openReport);
